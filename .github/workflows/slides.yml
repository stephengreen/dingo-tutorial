name: Slides

# Builds every Quarto deck in slides/<deck>/ from its frozen outputs (slides/<deck>/_freeze;
# no Python or dingo needed) and, if the repository variable DEPLOY_PAGES is "true",
# publishes it at <pages-url>/<deck>/ with a listing page at <pages-url>/.

on:
  push:
    branches: [main]
    paths: ["slides/**", ".github/workflows/slides.yml"]
  pull_request:
    paths: ["slides/**", ".github/workflows/slides.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render decks (frozen outputs; no code execution)
        run: |
          mkdir -p site
          echo '<!doctype html><meta charset="utf-8"><title>DINGO tutorial slides</title>' > site/index.html
          echo '<h1>DINGO tutorial slides</h1><ul>' >> site/index.html
          for deck in slides/*/; do
            name=$(basename "$deck")
            quarto render "$deck"
            cp -r "$deck/_output" "site/$name"
            echo "<li><a href=\"$name/\">$name</a></li>" >> site/index.html
          done
          echo '</ul>' >> site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
